services:
  # 1. CampusResQ Static Frontend
  - type: web
    runtime: static
    name: safety-exit
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    envVars:
      - key: MAPPEDIN_MAP_ID
        value: 6878b313316caa000b260be4
      - key: MAPPEDIN_ENV
        value: us
      - key: MAPPEDIN_AUTH_URL
        value: https://safety-exit-api.onrender.com/api/mappedin-token

  # 2. CampusResQ Mappedin Token Authentication Service
  # Securely handles private API credentials server-side and issues short-lived client access tokens
  - type: web
    runtime: node
    name: safety-exit-api
    plan: free
    buildCommand: npm install
    startCommand: npm run start:api
    healthCheckPath: /healthz
    envVars:
      - key: MAPPEDIN_KEY
        sync: false
      - key: MAPPEDIN_SECRET
        sync: false
      - key: MAPPEDIN_MAP_ID
        value: 6878b313316caa000b260be4
      - key: MAPPEDIN_ENV
        value: us
      - key: CORS_ORIGIN
        value: https://safety-exit.onrender.com
