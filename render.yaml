services:
  - type: static
    name: safety-exit
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    envVars:
      - key: MAPPEDIN_MAP_ID
        value: 6878b313316caa000b260be4
      - key: MAPPEDIN_ENV
        value: us
